name: Submit

on:
  issues:
    types: [opened]

permissions: {}

# One at a time, so each accepted entry merges before the next one edits entries.json.
concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  decide:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.result.outputs.ok }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Org block reads need an App token; GITHUB_TOKEN can't see them.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-organization-user-blocking: read
          permission-issues: read
      # An API failure exits non-zero with no result file, so nothing is accepted or rejected.
      - run: python -m scripts.submit decide --event "$GITHUB_EVENT_PATH" --out result.json
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          EXCLUDED_USERS: ${{ vars.EXCLUDED_USERS }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result
          path: result.json
          retention-days: 7
      - id: result
        run: python -c 'import json; print("ok=" + ("true" if json.load(open("result.json"))["ok"] is True else "false"))' >> "$GITHUB_OUTPUT"

  apply:
    needs: decide
    if: needs.decide.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: result
          path: ${{ runner.temp }}/result
      # The values were validated by decide; the regexes here keep them safe to use in shell.
      - id: meta
        env:
          RESULT: ${{ runner.temp }}/result/result.json
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          r = json.load(open(os.environ["RESULT"]))
          repo, issue = r["entry"]["repo"], r["issue"]
          assert re.fullmatch(r"[A-Za-z0-9-]+/[A-Za-z0-9._-]+", repo), repo
          assert type(issue) is int and issue > 0, issue
          print(f"repo={repo}")
          print(f"issue={issue}")
          PY
      - id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RESULT: ${{ runner.temp }}/result/result.json
          REPO_NAME: ${{ steps.meta.outputs.repo }}
        run: |
          branch=$(python -m scripts.submit apply --result "$RESULT")
          git switch -c "$branch"
          git add data/entries.json
          git -c user.name='devstreamhq-bot[bot]' \
            -c user.email='5633513+devstreamhq-bot[bot]@users.noreply.github.com' \
            commit -m "feat(list): add $REPO_NAME"
          git push origin "$branch"
          python -m scripts.submit comment --result "$RESULT" --kind pr > "$RUNNER_TEMP/pr-body.md"
          url=$(gh pr create --base main --head "$branch" --title "Add $REPO_NAME" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          gh pr merge "$url" --auto --squash
      # Holding the concurrency lock until the merge lands keeps the next apply off a stale entries.json.
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          for _ in $(seq 45); do
            [ "$(gh pr view "$PR_URL" --json state --jq .state)" = MERGED ] && exit 0
            sleep 20
          done
          echo "::error::$PR_URL did not merge within 15 minutes"
          exit 1
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RESULT: ${{ runner.temp }}/result/result.json
          ISSUE: ${{ steps.meta.outputs.issue }}
        run: |
          python -m scripts.submit comment --result "$RESULT" --kind accepted > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" --add-label accepted

  reject:
    needs: decide
    if: needs.decide.outputs.ok == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: result
          path: ${{ runner.temp }}/result
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RESULT: ${{ runner.temp }}/result/result.json
        run: |
          issue=$(python -c 'import json, os; i = json.load(open(os.environ["RESULT"]))["issue"]; assert type(i) is int; print(i)')
          python -m scripts.submit comment --result "$RESULT" --kind rejected > "$RUNNER_TEMP/comment.md"
          gh issue comment "$issue" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$issue" --add-label rejected
          gh issue close "$issue" --reason "not planned"
