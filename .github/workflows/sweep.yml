name: Sweep submissions

# The list-writes concurrency group keeps only one pending run, so bursts drop
# runs. This re-dispatches any submission left undecided, re-runs a health
# check that hasn't succeeded in 8 days, clears branches from applies that
# died before opening a PR, and closes rot PRs that never merged.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
      - run: python -m scripts.sweep
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
