name: Bug report
description: Something on the site or in the bots isn't working.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. To report a listed repo instead, use the "Report an entry" form. For a security issue, report it privately through the Security tab.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Steps, links or the issue number of the submission involved.
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: The page URL, or the workflow run if a bot went wrong.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on macOS
