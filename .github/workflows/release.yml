name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The build otherwise reports usage to telemetry.astro.build.
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stats
          path: stats-data
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the source tarball
        run: git archive --format=tar.gz --prefix="devstream-$GITHUB_REF_NAME/" -o "devstream-$GITHUB_REF_NAME.tar.gz" "$GITHUB_SHA"
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Package the site
        run: tar -czf "devstream-site-$GITHUB_REF_NAME.tar.gz" -C site/dist .
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            devstream-${{ github.ref_name }}.tar.gz
            devstream-site-${{ github.ref_name }}.tar.gz
      # Attached so anyone can verify the tarballs offline, with no GitHub API call.
      - name: Copy the provenance bundle
        run: cp "$BUNDLE" "devstream-$GITHUB_REF_NAME.intoto.jsonl"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "devstream-$GITHUB_REF_NAME.tar.gz" "devstream-site-$GITHUB_REF_NAME.tar.gz" "devstream-$GITHUB_REF_NAME.intoto.jsonl"
        env:
          GH_TOKEN: ${{ github.token }}
