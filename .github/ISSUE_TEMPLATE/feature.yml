name: Feature request
description: Suggest something DevStream should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? For something still taking shape, a thread in Discussions › Ideas is a good place to start.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe the change you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you've considered?
