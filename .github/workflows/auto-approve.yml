name: Auto-approve

# pull_request_target so GITHUB_TOKEN may approve. This workflow must never
# check out or run anything from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'devstreamhq-bot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --name-only)
          if [ "$files" != "data/entries.json" ]; then
            echo "::error::Only data/entries.json may change, got: $files"
            exit 1
          fi
          gh pr review "$PR" --approve
