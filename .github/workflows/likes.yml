name: Sync Likes

# Counts trusted thumbs-ups on each entry's Discussion, ranks entries, flags
# Like bursts and writes likes.json, meta.json and daily snapshots to stats.
on:
  # Started on time by the scheduler Worker (scheduler/); a stalled one is restarted by the sweep.
  workflow_dispatch:

permissions: {}

concurrency:
  group: likes
  cancel-in-progress: false

jobs:
  likes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-discussions: read
          permission-issues: write
          permission-organization-user-blocking: read
      - run: python -m scripts.sync_likes
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          EXCLUDED_USERS: ${{ vars.EXCLUDED_USERS }}
