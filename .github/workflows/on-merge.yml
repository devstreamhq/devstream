name: Create entry Discussions

# Every listed entry gets a Discussion; a thumbs-up on it is a Like. Submit and
# the health check make threads themselves, right after their PR merges; this
# hourly run is the backstop for the 40-per-run cap, failed creates and any
# other change to the list.
on:
  # Started on time by the scheduler Worker (scheduler/); a stalled one is restarted by the sweep.
  workflow_dispatch:

permissions: {}

# Shared with rot.yml so this waits until a rename's keys have moved and its
# thread is retitled; otherwise it would open a second thread for the new name.
# A run dropped from the queue costs nothing: the next one covers the same list.
concurrency:
  group: list-writes
  cancel-in-progress: false

jobs:
  discussions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-discussions: write
      - run: python -m scripts.on_merge
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
