name: Create entry Discussions

# Every listed entry gets a Discussion; a thumbs-up on it is a Like. The
# hourly run picks up whatever the 40-per-run cap left behind.
on:
  push:
    branches: [main]
    paths: [data/entries.json]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: discussions
  cancel-in-progress: false

jobs:
  discussions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-discussions: write
      - run: python -m scripts.on_merge
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
